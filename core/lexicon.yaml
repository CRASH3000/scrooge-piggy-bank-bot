screens:
  start_onboarding:
    text: |
      Кря! Я Скрудж Макдак, и я знаю цену каждому центу. Чтобы мы начали строить твою финансовую империю, запомни правила:

      1. Пиши число (например, 1000 или +1000) - это монетки в хранилище.
      2. Пиши -число (например, -500) - это траты на племянников или бизнес.
      3. Выбирай категорию на кнопках, и всё — данные в сейфе!

      Введи свой стартовый капитал, и мы начнем вместе заполнять твое личное хранилище
    image_path: "media/scrooge_onboarding.jpg"

  main_vault:
    text: |
      Сегодня копим или тратим?

      💰 Текущий баланс: {balance}
      🏦 Уровень хранилища: {vault_level_number}
      👑 Ранг: {vault_rank_name}

      {quote}

  monthly_balance:
    text: |
      📊 Отчет за текущий месяц

      Заработано: {income_for_month}
      Потрачено: {expense_for_month}
      Общий баланс: {current_balance}

      {achievement}

    image_path: "media/scrooge_monthly_balance.jpg"

  help_rules:
    text: |
      Напомню, как устроены наши деловые отношения.

      1. Пиши `число` (например, 1000 или +1000) - это пополнение твоего хранилища.
      2. Пиши `-число` (например, -500) - это траты на жизнь, племянников или важные дела.
      3. После ввода суммы я предложу выбрать категорию, чтобы запись попала в Гроссбух.

      Команда /vault показывает текущее состояние хранилища.
      Команда /balance показывает отчет за текущий месяц.
      Команда /export выгружает полную историю операций в CSV.

      Работай с капиталом аккуратно, и, возможно, однажды дорастешь до моего уровня. Кря!

  export_ready:
    text: "Твоя полная выписка из Гроссбуха готова! 📜"

  income_category:
    text: "Сумма: {amount} ₽. Откуда дровишки? Выбери категорию:"
    buttons:
      - text: "💼 Зарплата"
        callback_data: "income_salary"
      - text: "🚀 Бизнес"
        callback_data: "income_business_freelance"
      - text: "🎁 Подарки"
        callback_data: "income_gifts"
      - text: "📈 Проценты"
        callback_data: "income_interest"
      - text: "🔄 Возврат"
        callback_data: "income_refund"
    cancel_button:
      text: "❌ Отмена"
      callback_data: "cancel_transaction"

  expense_category:
    text: "Сумма: {amount} ₽. Куда улетели монетки? Выбери категорию:"
    buttons:
      - text: "🛒 Продукты"
        callback_data: "expense_products"
      - text: "🍔 Кафе"
        callback_data: "expense_cafe"
      - text: "🏠 Жилье"
        callback_data: "expense_housing"
      - text: "🚗 Транспорт"
        callback_data: "expense_transport"
      - text: "💊 Здоровье"
        callback_data: "expense_health"
      - text: "👕 Одежда"
        callback_data: "expense_clothes"
      - text: "📱 Подписки"
        callback_data: "expense_subscriptions"
      - text: "🎉 Развлечения"
        callback_data: "expense_entertainment"
      - text: "📚 Хобби"
        callback_data: "expense_hobby"
      - text: "💸 Долги"
        callback_data: "expense_debts"
      - text: "🛍 Прочее"
        callback_data: "expense_other"
    cancel_button:
      text: "❌ Отмена"
      callback_data: "cancel_transaction"

  success:
    text: |
      ✅ Дзинь! {amount} ₽ успешно записано в {category}.
      Гроссбух обновлен! {easter_egg}

  validation_error:
    text: |
      Кря! Я понимаю только язык цифр. Напиши сумму (только цифры и знаки + или -).
      Попробуй еще раз!

  limit_error_income:
    text: |
      Кря! Мое хранилище не резиновое!
      Введи сумму до 1 миллиарда.

  limit_error_expense:
    text: |
      Кря! Ты хочешь пустить нас по миру?!
      Мое сердце не выдержит таких трат. Введи расход до 1 миллиарда!

  reset_success:
    text: "🗑 Все твои данные удалены. Можно начать заново через /start."

  reset_nothing_to_delete:
    text: "У тебя пока нет данных для удаления. Можешь начать работу через /start."

vault_screen_quotes:
  default_first_quote: "Кря! Главное держать хранилище под контролем."

  random_financial_literacy_quotes:
    - "Кря! Хочешь построить капитал? Сначала научись считать каждую монету. Деньги любят точный учет."
    - "Запомни простое правило, дружок: нельзя стать богаче, если тратишь больше, чем зарабатываешь."
    - "Получил доход? Сначала отложи часть в хранилище, а уже потом думай о тратах."
    - "Умный селезень сперва строит финансовую подушку, а уже потом гоняется за красивыми покупками."
    - "Кря! Спокойнее спится тому, у кого есть запас монет хотя бы на несколько месяцев жизни."
    - "Не путай нужное с приятным. Без этого даже полное хранилище быстро дает течь."
    - "Если покупка и завтра кажется важной, то может, в ней и правда есть смысл. А если нет, монеты лучше сохранить."
    - "Большой капитал редко начинается с сундука золота. Чаще он начинается с маленьких, но регулярных накоплений."
    - "Долги — это прожорливые утки: стоит их запустить, и они начинают клевать твой капитал без остановки."
    - "Если уж влез в долги, первым делом избавляйся от самых дорогих. Переплата - это враг хранилища."
    - "Рост дохода сам по себе не делает тебя богаче. Богаче делает привычка сохранять часть каждого роста."
    - "Кря! Не спеши жить роскошнее при первом же лишнем мешке монет. Хранилище растет у терпеливых."
    - "На каждую крупную цель нужен свой запас. Иначе мечты так и останутся разговорами у пустого сейфа."
    - "Сбережения - это не жадность, а защита твоей свободы и спокойствия."
    - "Капитал строится не чудом, а порядком: учитывать, откладывать, не транжирить и повторять это снова и снова."

