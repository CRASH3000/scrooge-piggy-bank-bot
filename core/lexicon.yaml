easter_eggs:
  education: "Инвестиция в себя - это лучшее вложение средств!"
  clothes: "О, кто-то решил обновить гардероб! Встречают по одежке, а провожают по уму. Главное не переусердствуй."
  business: "Деньги должны работать! Кря! Отличная сделка."

  cafe: "Кря! Неплохо посидел, да? Главное, чтобы кофе не оказался золотым по цене."
  entertainment: "Веселиться можно, но не устраивай праздник за счет будущего хранилища."
  subscriptions: "Подписки коварная штука. По одной незаметны, а вместе прогрызают дыру в бюджете."
  debts: "Кря! Долги сами себя не съедят. Хорошо, что понемногу снимаешь этот груз с шеи."
  interest: "Вот это мне нравится! Монеты сами принесли тебе новых друзей."
  gifts: "Приятный подарок! Но не думай, что даровые монеты можно сразу спустить без счета."
  too_many_other_expenses: "Кря! Я смотрю, у тебя в 'Прочем' уже целая свалка трат. Пора бы разобраться, куда именно утекают монеты."
  too_much_entertainment_share: "Кря! Я смотрю, развлечения уже отъели солидный кусок твоих расходов. Веселиться полезно, но не до такой же степени."
  too_many_cafe_expenses: "Я гляжу, ты уже слишком часто заглядываешь в кафе. Вкусно, спору нет, но хранилище такие привычки не любит."